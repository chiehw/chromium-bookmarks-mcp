name: Build binaries and publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests
        run: go test ./...

      - name: Build binaries
        run: python3 scripts/build-release.py --version "${GITHUB_REF_NAME}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chromium-bookmarks-mcp-${{ github.ref_name }}
          path: dist/*

      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "chromium-bookmarks-mcp ${GITHUB_REF_NAME}" --generate-notes
          fi
