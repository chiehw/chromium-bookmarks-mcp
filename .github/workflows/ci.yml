name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate WXT type stubs
        run: npm run wxt:prepare -w @chromium-bookmarks-mcp/extension

      - name: Test
        run: npm test -w @chromium-bookmarks-mcp/extension

      - name: Typecheck
        run: npm run typecheck -w @chromium-bookmarks-mcp/extension

      - name: Build
        run: npm run build -w @chromium-bookmarks-mcp/extension
